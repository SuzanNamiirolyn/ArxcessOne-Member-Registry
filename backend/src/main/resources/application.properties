# Database — Dev Services will AUTO-START an in-memory MySQL for you!
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/member_directory

# Auto-create tables (dev only)
quarkus.hibernate-orm.database.generation=update

# CORS fixed (new format)
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors=true

# OpenAPI
quarkus.swagger-ui.always-include=true

# ⭐ AUTO-START database if none running!
quarkus.devservices.enabled=true